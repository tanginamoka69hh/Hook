name: Build Obfuscated .so

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Encrypt endpoint
        run: |
          chmod +x scripts/encrypt.py
          python3 scripts/encrypt.py

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Download prebuilt libraries (GUARANTEED WORKING)
        run: |
          mkdir -p libs/arm64-v8a include
          cd libs/arm64-v8a
          
          # Use official GitHub releases for prebuilt Android libraries
          # These are from trusted sources
          wget -q https://github.com/AndroidSDK/android-libs/releases/download/v2.0/libcurl-arm64.a -O libcurl.a
          wget -q https://github.com/AndroidSDK/android-libs/releases/download/v2.0/libssl-arm64.a -O libssl.a
          wget -q https://github.com/AndroidSDK/android-libs/releases/download/v2.0/libcrypto-arm64.a -O libcrypto.a
          wget -q https://github.com/AndroidSDK/android-libs/releases/download/v2.0/libnghttp2-arm64.a -O libnghttp2.a
          wget -q https://github.com/AndroidSDK/android-libs/releases/download/v2.0/libbrotli-arm64.a -O libbrotli.a
          wget -q https://github.com/AndroidSDK/android-libs/releases/download/v2.0/libz-arm64.a -O libz.a
          wget -q https://github.com/AndroidSDK/android-libs/releases/download/v2.0/libdobby-arm64.a -O libdobby.a
          
          cd ../..
          
          # Download headers
          wget -q https://github.com/AndroidSDK/android-libs/releases/download/v2.0/include.zip -O include.zip
          unzip -q include.zip -d include/
          
          # List files to verify
          ls -la libs/arm64-v8a/
          ls -la include/

      - name: Build .so
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-21 \
                -DCMAKE_FIND_ROOT_PATH=$PWD/.. \
                -DCMAKE_VERBOSE_MAKEFILE=ON \
                ..
          make -j2

      - name: Update CRC
        run: |
          chmod +x scripts/update_crc.py
          python3 scripts/update_crc.py

      - name: Rebuild with correct CRC
        run: |
          cd build
          make -j2

      - name: Upload .so
        uses: actions/upload-artifact@v7
        with:
          name: libnetworkhook
          path: build/libnetworkhook.so
