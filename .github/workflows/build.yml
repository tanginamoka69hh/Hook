name: Build Obfuscated .so

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Encrypt endpoint
        run: |
          chmod +x scripts/encrypt.py
          python3 scripts/encrypt.py

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r25c" >> $GITHUB_ENV
          echo "PATH=$PWD/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> $GITHUB_ENV

      - name: Build all dependencies (FIXED)
        run: |
          export ANDROID_NDK=$GITHUB_WORKSPACE/android-ndk-r25c
          export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CC=aarch64-linux-android21-clang
          export CXX=aarch64-linux-android21-clang++
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export CFLAGS="-fPIC"
          export CXXFLAGS="-fPIC"
          
          mkdir -p libs/arm64-v8a include
          cd $GITHUB_WORKSPACE

          # -------------------- zlib --------------------
          git clone --depth 1 https://github.com/madler/zlib.git /tmp/zlib
          cd /tmp/zlib
          CC=aarch64-linux-android21-clang AR=llvm-ar RANLIB=llvm-ranlib ./configure --static --prefix=$PWD/install
          make -j$(nproc)
          make install
          cp install/lib/libz.a $GITHUB_WORKSPACE/libs/arm64-v8a/
          cp -r install/include/* $GITHUB_WORKSPACE/include/

          # -------------------- OpenSSL (CORRECT TARGET) --------------------
          git clone --depth 1 -b openssl-3.4.1 https://github.com/openssl/openssl.git /tmp/openssl
          cd /tmp/openssl
          # Use android-arm64-clang target (for clang)
          ./Configure android-arm64-clang -D__ANDROID_API__=21 no-shared --prefix=$PWD/install
          make -j$(nproc)
          make install_sw
          cp install/lib/libcrypto.a $GITHUB_WORKSPACE/libs/arm64-v8a/
          cp install/lib/libssl.a $GITHUB_WORKSPACE/libs/arm64-v8a/
          cp -r install/include/* $GITHUB_WORKSPACE/include/

          # -------------------- nghttp2 --------------------
          git clone --depth 1 -b v1.64.0 https://github.com/nghttp2/nghttp2.git /tmp/nghttp2
          cd /tmp/nghttp2
          autoreconf -fi
          ./configure --host=aarch64-linux-android --disable-shared --enable-static \
                      --without-libxml2 --without-systemd --without-jemalloc \
                      --disable-examples --disable-app --disable-hpack-tools \
                      --disable-ping-tool --disable-client --disable-server \
                      --enable-lib-only \
                      CFLAGS="-fPIC" CXXFLAGS="-fPIC"
          make -j$(nproc)
          cp lib/.libs/libnghttp2.a $GITHUB_WORKSPACE/libs/arm64-v8a/
          cp -r lib/includes/* $GITHUB_WORKSPACE/include/

          # -------------------- Brotli --------------------
          git clone --depth 1 -b v1.1.0 https://github.com/google/brotli.git /tmp/brotli
          cd /tmp/brotli
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 \
                -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=$PWD/install \
                ..
          make -j$(nproc)
          make install
          cp install/lib/libbrotlicommon.a $GITHUB_WORKSPACE/libs/arm64-v8a/
          cp install/lib/libbrotlidec.a $GITHUB_WORKSPACE/libs/arm64-v8a/
          cp install/lib/libbrotlienc.a $GITHUB_WORKSPACE/libs/arm64-v8a/
          cp -r install/include/* $GITHUB_WORKSPACE/include/

          # -------------------- libcurl --------------------
          git clone --depth 1 -b curl-8_12_1 https://github.com/curl/curl.git /tmp/curl
          cd /tmp/curl
          autoreconf -fi
          ./configure --host=aarch64-linux-android \
                      --with-ssl=$GITHUB_WORKSPACE \
                      --with-nghttp2=$GITHUB_WORKSPACE \
                      --with-brotli=$GITHUB_WORKSPACE \
                      --with-zlib=$GITHUB_WORKSPACE \
                      --disable-shared --enable-static \
                      --disable-ldap --disable-ldaps --disable-rtsp \
                      --disable-dict --disable-telnet --disable-tftp \
                      --disable-pop3 --disable-imap --disable-smtp \
                      --disable-gopher --disable-ftp --disable-file \
                      --without-libidn2 \
                      CFLAGS="-I$GITHUB_WORKSPACE/include -fPIC" \
                      LDFLAGS="-L$GITHUB_WORKSPACE/libs/arm64-v8a"
          make -j$(nproc)
          cp lib/.libs/libcurl.a $GITHUB_WORKSPACE/libs/arm64-v8a/

          # -------------------- Dobby --------------------
          git clone https://github.com/jmpews/Dobby.git /tmp/Dobby
          cd /tmp/Dobby
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-21 \
                -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                ..
          make -j$(nproc)
          cp libdobby.a $GITHUB_WORKSPACE/libs/arm64-v8a/
          cp ../include/dobby.h $GITHUB_WORKSPACE/include/

      - name: Build .so
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-21 \
                -DCMAKE_FIND_ROOT_PATH=$PWD/.. \
                -DCMAKE_VERBOSE_MAKEFILE=ON \
                ..
          make -j2

      - name: Update CRC
        run: |
          chmod +x scripts/update_crc.py
          python3 scripts/update_crc.py

      - name: Rebuild with correct CRC
        run: |
          cd build
          make -j2

      - name: Upload .so
        uses: actions/upload-artifact@v7
        with:
          name: libnetworkhook
          path: build/libnetworkhook.so
