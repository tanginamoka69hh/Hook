name: Build Obfuscated .so

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Encrypt endpoint
        run: |
          chmod +x scripts/encrypt.py
          python3 scripts/encrypt.py

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Download prebuilt libraries (OpenSSL + libcurl)
        run: |
          mkdir -p libs/arm64-v8a include
          cd libs/arm64-v8a
          
          # Download OpenSSL 3.4.1 (arm64-v8a) from reliable source
          wget https://raw.githubusercontent.com/AndroidSDK/android-libs/main/openssl-3.4.1-arm64.tar.gz
          tar -xzf openssl-3.4.1-arm64.tar.gz
          cp openssl/lib/libssl.a .
          cp openssl/lib/libcrypto.a .
          cp -r openssl/include/* ../../
          rm -rf openssl-3.4.1-arm64.tar.gz openssl
          
          # Download libcurl 8.12.1 (arm64-v8a)
          wget https://raw.githubusercontent.com/AndroidSDK/android-libs/main/libcurl-8.12.1-arm64.a -O libcurl.a
          
          cd ../..
          
          # Verify files
          ls -la libs/arm64-v8a/
          ls -la include/

      - name: Build .so
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-21 \
                -DCMAKE_FIND_ROOT_PATH=$PWD/.. \
                -DCMAKE_VERBOSE_MAKEFILE=ON \
                ..
          make -j2

      - name: Update CRC
        run: |
          chmod +x scripts/update_crc.py
          python3 scripts/update_crc.py

      - name: Rebuild with correct CRC
        run: |
          cd build
          make -j2

      - name: Upload .so
        uses: actions/upload-artifact@v7
        with:
          name: libnetworkhook
          path: build/libnetworkhook.so
