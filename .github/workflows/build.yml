name: Build Obfuscated .so

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install OpenSSL & curl dev
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl libssl-dev libcurl4-openssl-dev

      - name: Encrypt endpoint
        run: |
          chmod +x scripts/encrypt.py
          python3 scripts/encrypt.py

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Download Dobby
        run: |
          mkdir -p libs/arm64-v8a include
          cd libs/arm64-v8a
          wget -q https://github.com/jmpews/Dobby/releases/download/v1.0.0/libdobby-arm64.a
          cd ../..
          wget -q https://raw.githubusercontent.com/jmpews/Dobby/master/include/dobby.h -O include/dobby.h

      - name: Build .so
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-21 \
                -DCMAKE_FIND_ROOT_PATH=$PWD/.. \
                -DCMAKE_CXX_FLAGS="-Os -fno-exceptions -fno-rtti -std=c++14" \
                -DCMAKE_VERBOSE_MAKEFILE=ON \
                ..
          make -j2

      - name: Update CRC
        run: |
          chmod +x scripts/update_crc.py
          python3 scripts/update_crc.py

      - name: Rebuild with correct CRC
        run: |
          cd build
          make -j2

      - name: Upload .so
        uses: actions/upload-artifact@v7
        with:
          name: libnetworkhook
          path: build/libnetworkhook.so
