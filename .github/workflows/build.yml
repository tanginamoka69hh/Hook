name: Build Obfuscated .so

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install OpenSSL & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl libssl-dev libcurl4-openssl-dev cmake ninja-build

      - name: Encrypt endpoint
        run: |
          chmod +x scripts/encrypt.py
          python3 scripts/encrypt.py

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Build Dobby from source
        run: |
          git clone https://github.com/jmpews/Dobby.git /tmp/Dobby
          cd /tmp/Dobby
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-21 \
                -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_BUILD_TYPE=Release \
                ..
          make -j$(nproc)
          mkdir -p $GITHUB_WORKSPACE/libs/arm64-v8a
          cp libdobby.a $GITHUB_WORKSPACE/libs/arm64-v8a/
          cp ../include/dobby.h $GITHUB_WORKSPACE/include/
          cd $GITHUB_WORKSPACE

      - name: Download libcurl (Android arm64)
        run: |
          cd libs/arm64-v8a
          wget -q https://github.com/vvb2060/curl-android/releases/download/v1.0.0/libcurl-arm64.a || echo "curl download failed"

      - name: Download OpenSSL (Android arm64)
        run: |
          cd libs/arm64-v8a
          wget -q https://github.com/kibitzerCZ/Prebuilt-OpenSSL-for-Android/releases/download/v1.0.0/libssl-arm64.a || echo "openssl download failed"
          wget -q https://github.com/kibitzerCZ/Prebuilt-OpenSSL-for-Android/releases/download/v1.0.0/libcrypto-arm64.a || echo "openssl download failed"

      - name: Build .so
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-21 \
                -DCMAKE_FIND_ROOT_PATH=$PWD/.. \
                -DCMAKE_VERBOSE_MAKEFILE=ON \
                ..
          make -j2

      - name: Update CRC
        run: |
          chmod +x scripts/update_crc.py
          python3 scripts/update_crc.py

      - name: Rebuild with correct CRC
        run: |
          cd build
          make -j2

      - name: Upload .so
        uses: actions/upload-artifact@v7
        with:
          name: libnetworkhook
          path: build/libnetworkhook.so
