name: Build Obfuscated .so

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y openssl

      - name: Encrypt endpoint
        run: |
          chmod +x scripts/encrypt.py
          python3 scripts/encrypt.py

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Download dependencies
        run: |
          mkdir -p libs/arm64-v8a include
          cd libs/arm64-v8a
          wget -q https://github.com/jmpews/Dobby/releases/download/v1.0.0/libdobby-arm64.a
          wget -q https://github.com/vvb2060/curl-android/releases/download/v1.0.0/libcurl-arm64.a
          wget -q https://github.com/kibitzerCZ/Prebuilt-OpenSSL-for-Android/releases/download/v1.0.0/libssl-arm64.a
          wget -q https://github.com/kibitzerCZ/Prebuilt-OpenSSL-for-Android/releases/download/v1.0.0/libcrypto-arm64.a
          cd ../..
          wget -q https://raw.githubusercontent.com/jmpews/Dobby/master/include/dobby.h -O include/dobby.h

      - name: Build .so
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-21 \
                -DCMAKE_FIND_ROOT_PATH=$PWD/.. \
                ..
          make -j$(nproc)

      - name: Update CRC (Anti-Tamper)
        run: |
          chmod +x scripts/update_crc.py
          python3 scripts/update_crc.py

      - name: Rebuild with correct CRC
        run: |
          cd build
          make -j$(nproc)

      - name: Upload .so file
        uses: actions/upload-artifact@v4
        with:
          name: libnetworkhook
          path: build/libnetworkhook.so
