name: Build Obfuscated .so

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Encrypt endpoint
        run: |
          chmod +x scripts/encrypt.py
          python3 scripts/encrypt.py

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Download prebuilt libraries
        run: |
          mkdir -p libs/arm64-v8a include
          cd libs/arm64-v8a
          
          # Download libcurl (Android arm64) - multiple fallback sources
          wget -q https://github.com/curl/curl/releases/download/curl-8_12_1/libcurl-android-arm64.a || \
          wget -q https://raw.githubusercontent.com/curl/curl/curl-8_12_1/android/libcurl.a || \
          echo "libcurl download failed"
          
          # Download OpenSSL (Android arm64)
          wget -q https://github.com/openssl/openssl/releases/download/openssl-3.4.1/libssl-android-arm64.a || \
          wget -q https://raw.githubusercontent.com/openssl/openssl/openssl-3.4.1/android/libssl.a || \
          echo "libssl download failed"
          
          wget -q https://github.com/openssl/openssl/releases/download/openssl-3.4.1/libcrypto-android-arm64.a || \
          wget -q https://raw.githubusercontent.com/openssl/openssl/openssl-3.4.1/android/libcrypto.a || \
          echo "libcrypto download failed"
          
          cd ../..

      - name: Build .so
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-21 \
                -DCMAKE_FIND_ROOT_PATH=$PWD/.. \
                -DCMAKE_VERBOSE_MAKEFILE=ON \
                ..
          make -j2

      - name: Update CRC
        run: |
          chmod +x scripts/update_crc.py
          python3 scripts/update_crc.py

      - name: Rebuild with correct CRC
        run: |
          cd build
          make -j2

      - name: Upload .so
        uses: actions/upload-artifact@v7
        with:
          name: libnetworkhook
          path: build/libnetworkhook.so
